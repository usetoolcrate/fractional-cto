<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Admin — Schottky</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f4; --paper-deep:#f1ede5; --ink:#1c1e21; --ink-soft:#4a4f56; --ink-faint:#8a8f96;
    --accent:#1f5c48; --accent-bright:#2b7a5f; --accent-tint:#e7f0ec;
    --brass:#b0812f; --brass-tint:#f6eedf; --alert:#a2402e; --alert-tint:#f8e9e5;
    --line:#e2dcd0; --card:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:500;line-height:1.15;letter-spacing:-.01em}
  a{color:var(--accent)}
  button,input{font:inherit}
  :focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
  [hidden]{display:none !important}
  .num{font-variant-numeric:tabular-nums}

  header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5}
  .bar{max-width:1240px;margin:0 auto;padding-inline:20px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{font-family:'Newsreader',serif;font-size:1.15rem;font-weight:600;color:var(--ink);text-decoration:none}
  .logo span{color:var(--accent)}
  .bar-right{display:flex;align-items:center;gap:14px;font-size:.85rem;color:var(--ink-soft)}
  .tabs{display:flex;gap:2px;margin-left:10px;margin-right:auto}
  .tabs a{font-size:.88rem;font-weight:600;color:var(--ink-soft);text-decoration:none;padding:6px 10px;border-radius:6px}
  .tabs a:hover{background:var(--paper-deep)}
  .tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-tint)}
  .pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.test{color:var(--brass);background:var(--brass-tint);border:1px solid #e8d7b6}
  .pill.ok{color:var(--accent);background:var(--accent-tint)}
  .pill.warn{color:#8a6320;background:var(--brass-tint)}
  .pill.bad{color:var(--alert);background:var(--alert-tint)}
  .pill.muted{color:var(--ink-soft);background:var(--paper-deep)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--accent-bright)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn.ghost:hover{background:var(--accent-tint)}
  .btn.danger{background:var(--alert)}
  .btn.small{padding:5px 10px;font-size:.8rem}
  .link{background:none;border:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.85rem;padding:0}
  .link.bad{color:var(--alert)}

  label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--ink-soft);min-width:0}
  input.i{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:8px 10px;font-size:.95rem;color:var(--ink);width:100%;min-width:0}
  input.i:focus{border-color:var(--accent)}
  select.i{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:8px 10px;font:inherit;font-size:.95rem;color:var(--ink);width:100%;min-width:0}
  .breakdown{margin:10px 0 0;font-size:.9rem;color:var(--ink)}
  .breakdown:empty{display:none}
  textarea.i{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:10px 12px;font:inherit;font-size:.95rem;line-height:1.55;color:var(--ink);width:100%;min-width:0;resize:vertical}
  textarea.i:focus{border-color:var(--accent);outline:none}
  .draft{margin-top:14px;display:grid;gap:10px}
  .msg{font-size:.88rem;min-height:1.3em}
  .msg:empty{display:none}
  .msg.err{color:var(--alert)}
  .msg.ok{color:var(--accent)}

  /* Login */
  .login{max-width:380px;margin:12vh auto 0;padding-inline:20px;display:flex;flex-direction:column;gap:16px}
  .login h1{font-size:2rem}

  /* Layout */
  .app{max-width:1240px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:82px}
  .side-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .side-head h2{font-size:1.35rem}
  .list{list-style:none;overflow:hidden}
  .list li+li{border-top:1px solid var(--line)}
  .list button{width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;color:var(--ink)}
  .list button:hover{background:var(--paper)}
  .list button[aria-current="true"]{background:var(--accent-tint)}
  .list .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .sub{grid-column:1;font-size:.8rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .pill{grid-row:1 / span 2;grid-column:2;align-self:center}
  .empty{padding:16px 14px;color:var(--ink-soft);font-size:.9rem}
  .newform{padding:14px;display:flex;flex-direction:column;gap:10px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

  /* Detail */
  .detail{display:flex;flex-direction:column;gap:18px;min-width:0}
  .d-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .d-head h1{font-size:2rem}
  .d-head .meta{color:var(--ink-soft);font-size:.9rem}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .tile{padding:16px;display:flex;flex-direction:column;gap:4px}
  .tile .k{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .tile .v{font-family:'Newsreader',serif;font-size:1.5rem;line-height:1.2}
  .tile .s{font-size:.82rem;color:var(--ink-soft)}
  .sec{padding:18px;display:flex;flex-direction:column;gap:12px}
  .sec h2{font-size:1.25rem}
  .sec .hint{font-size:.85rem;color:var(--ink-soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .codebox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper-deep);border-radius:8px;padding:12px 14px}
  .codebox code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.15rem;letter-spacing:.08em}

  .phases{list-style:none;border:1px solid var(--line);border-radius:8px}
  .phases>li{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .phases>li+li{border-top:1px solid var(--line)}
  .phases .amt{font-weight:600}
  .phases .when{font-size:.85rem;color:var(--ink-soft)}
  .phases .items{grid-column:1 / -1;font-size:.85rem;color:var(--ink-soft)}
  .billed{list-style:none;display:flex;flex-direction:column;gap:6px}
  .billed li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
  .confirm{border:1px solid #e8d7b6;background:var(--brass-tint);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

  .designer .ph{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) 150px;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
  .designer .ongoing{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-soft);padding-bottom:8px;white-space:nowrap}
  .modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .modeopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--card)}
  .modeopt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
  .modeopt input{margin-top:3px;accent-color:var(--accent)}
  .modeopt strong{display:block;font-size:.9rem}
  .modeopt .hint{display:block;font-size:.8rem;color:var(--ink-soft)}
  .preview{background:var(--accent-tint);border-radius:8px;padding:12px 14px;font-size:.9rem}
  .preview strong{font-variant-numeric:tabular-nums}
  .net{font-size:.82rem;color:var(--accent);font-weight:500}
  .phases .net{grid-column:1 / -1}
  .nettable-wrap{overflow-x:auto;margin-top:8px}
  .nettable{width:100%;border-collapse:collapse;font-size:.85rem;min-width:520px}
  .nettable th{text-align:right;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);padding:4px 8px;border-bottom:1px solid #c9ddd4}
  .nettable th:first-child,.nettable td:first-child{text-align:left}
  .nettable td{text-align:right;padding:6px 8px;border-bottom:1px solid #d7e6df;font-variant-numeric:tabular-nums}
  .nettable tr:last-child td{border-bottom:0}
  .nettable .keep{color:var(--accent);font-weight:600}
  .feenote{font-size:.75rem;color:var(--ink-faint)}

  .inv{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .inv-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 6.5rem 8rem 6rem;gap:10px;align-items:center;padding:9px 14px;font-size:.88rem}
  .inv>.inv-row:not(:first-child){border-top:1px solid var(--line)}
  .inv-row .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .inv-row .l{text-align:right}
  .inv-row .d{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .placeholder{padding:40px 20px;text-align:center;color:var(--ink-soft)}

  @media (max-width:900px){
    .app{grid-template-columns:minmax(0,1fr)}
    .side{position:static}
    .tiles{grid-template-columns:minmax(0,1fr)}
    .designer .ph{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .modes{grid-template-columns:minmax(0,1fr)}
    .designer .ph .nm-f{grid-column:1 / -1}
    .inv-row{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
    .inv-row .d{grid-column:1 / -1;grid-row:2}
    .inv-row .l{grid-column:1 / -1;text-align:left}
    .bar,.app{padding-inline:16px}
  }
  @media (max-width:560px){
    .bar-right .lbl{display:none}
    .logo{white-space:nowrap}
    .link{white-space:nowrap}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="/">Schottky <span>LLC</span></a>
    <nav class="tabs" aria-label="Admin pages"><a href="/admin" aria-current="page">Clients</a><a href="/admin/sites">Sites</a></nav>
    <div class="bar-right">
      <span class="pill test" id="test-pill" hidden>Stripe test mode</span>
      <button class="link" id="signout" type="button" hidden>Sign out</button>
    </div>
  </div>
</header>

<form class="login" id="login" hidden>
  <h1>Client admin</h1>
  <label class="f">Password<input class="i" id="pw" type="password" autocomplete="current-password" required></label>
  <button class="btn" type="submit">Sign in</button>
  <p class="msg err" id="login-msg" role="alert"></p>
</form>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="side-head">
      <h2>Clients</h2>
      <button class="link" type="button" id="refresh">Refresh</button>
    </div>
    <ul class="panel list" id="list"><li class="empty">Loading…</li></ul>
    <form class="panel newform" id="new-client" novalidate>
      <h3 style="font-size:1.05rem">New client</h3>
      <label class="f">Name<input class="i" id="nc-name" autocomplete="off" required></label>
      <label class="f">Billing email<input class="i" id="nc-email" type="email" autocomplete="off" required></label>
      <button class="btn" type="submit">Add client</button>
      <p class="msg err" id="nc-msg" role="alert"></p>
    </form>
  </aside>

  <main class="detail" id="detail">
    <div class="panel placeholder">Pick a client, or add a new one.</div>
  </main>
</div>

<script>
(function () {
  var TZ = "America/Chicago";
  var $ = function (id) { return document.getElementById(id); };
  var money = function (c) { return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" }).format((c || 0) / 100); };
  var date = function (s, o) { return new Date(s * 1000).toLocaleDateString("en-US", Object.assign({ timeZone: TZ }, o || { month: "short", day: "numeric", year: "numeric" })); };
  var monthYear = function (s) { return date(s, { month: "short", year: "numeric" }); };
  var rid = function () { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); };

  /* What I keep after Stripe fees (admin-only estimate). Stripe US standard
     pricing checked Sept 2026: card 2.9% + 30¢; ACH Direct Debit 0.8% capped
     at $5; Stripe Billing 0.7% on subscription payments; Stripe Invoicing
     0.4% on one-off invoices. Stripe rounds per charge, so cents may differ.
     Not included: disputes, failed ACH ($4), instant payouts. */
  var FEES = { cardPct: 0.029, cardFixed: 30, achPct: 0.008, achCap: 500, billingPct: 0.007, invoicingPct: 0.004 };
  function stripeFee(amount, method, kind) {
    var processing = method === "bank" ? Math.min(Math.round(amount * FEES.achPct), FEES.achCap) : Math.round(amount * FEES.cardPct) + FEES.cardFixed;
    return processing + Math.round(amount * (kind === "invoice" ? FEES.invoicingPct : FEES.billingPct));
  }
  function keep(amount, method, kind) { return amount - stripeFee(amount, method, kind || "subscription"); }
  function methodOf(a) { return a && a.autopay ? (a.autopay.kind === "bank" ? "bank" : "card") : null; }
  function keepText(amount, kind, prefer, suffix) {
    suffix = suffix || "";
    var b = money(keep(amount, "bank", kind)) + suffix, c = money(keep(amount, "card", kind)) + suffix;
    if (prefer === "bank") return "You keep ≈ " + b + " (their bank on file; " + c + " if by card)";
    if (prefer === "card") return "You keep ≈ " + c + " (their card on file; " + b + " if by bank)";
    return "You keep ≈ " + b + " by bank · " + c + " by card";
  }
  function feeNote(kind) {
    return el("p", { class: "feenote", text: "“You keep” is an estimate after Stripe fees: card 2.9% + 30¢, bank 0.8% (max $5), plus " +
      (kind === "invoice" ? "0.4% Stripe Invoicing" : "0.7% Stripe Billing") + ". Only you see this; clients never do." });
  }

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }

  async function api(path, body, method) {
    var opts = { credentials: "same-origin", headers: { "Content-Type": "application/json" } };
    if (body !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(body); }
    if (method) opts.method = method;
    var r = await fetch(path, opts);
    var data = {};
    try { data = await r.json(); } catch (e) {}
    if (r.status === 401) showLogin();
    return { ok: r.ok, status: r.status, data: data };
  }

  function showLogin() {
    $("login").hidden = false; $("app").hidden = true; $("signout").hidden = true;
    $("pw").focus();
  }
  function showApp() { $("login").hidden = true; $("app").hidden = false; $("signout").hidden = false; }

  // Year/month of a phase boundary in Central time. Boundaries are midnight
  // Central, but Stripe keeps the anchor's UTC clock time, so after a
  // daylight-saving change one can land at 11pm the night before the 1st.
  // Nudge past that before reading the Central year/month.
  function ym(sec) {
    var p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "numeric" }).formatToParts(new Date((sec + 3 * 3600) * 1000));
    var y = 0, m = 0;
    p.forEach(function (x) { if (x.type === "year") y = +x.value; if (x.type === "month") m = +x.value; });
    return { y: y, m: m - 1 };
  }
  // Noon UTC on the 1st of a Central year/month: formats as that month in Central.
  function monthStamp(y, m) { return Math.floor(Date.UTC(y, m, 1, 12) / 1000); }
  function phaseMonth(sec) { var p = ym(sec); return monthYear(monthStamp(p.y, p.m)); }
  // Date of the last charge in a phase of n monthly charges starting at start.
  function lastCharge(start, n) { var s = ym(start); return monthStamp(s.y, s.m + n - 1); }
  function months(n) { return n + (n === 1 ? " month" : " months"); }
  function monthsBetween(a, b) {
    var da = ym(a), db = ym(b);
    return (db.y - da.y) * 12 + (db.m - da.m);
  }
  function todayCentral() { return new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date()); }
  function dueText(ymd) {
    var p = ymd.split("-").map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)).toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric", year: "numeric" });
  }
  function pendingLine(pd) {
    return "Starts on payment: " + pd.phases.map(function (p) { return money(p.amount) + "/mo" + (p.months ? " × " + p.months : ""); }).join(" → ");
  }
  function manualLine(m) { return money(m.amount) + (m.interval === "year" ? "/yr" : "/mo") + " by " + m.method + " · next " + dueText(m.next); }
  function planLine(plan, pending, manual) {
    if (manual) return manualLine(manual);
    if (pending) return pendingLine(pending);
    if (!plan || !plan.length) return "No plan yet";
    return plan.map(function (p) { return money(p.amount) + "/mo" + (p.ongoing ? "" : " × " + monthsBetween(p.start, p.end)); }).join(" → ");
  }

  /* ---------- client list ---------- */
  var state = { clients: [], selected: null };

  function statusPill(c) {
    if (c.failed) return ["Payment failed", "bad"];
    if (c.owed) return ["Owes " + money(c.owed), "warn"];
    if (c.pending) return c.pending.due < todayCentral() ? ["First payment overdue", "bad"] : ["Awaiting first payment", "warn"];
    if (c.manual) return c.manual.next < todayCentral() ? ["Overdue · " + c.manual.method, "bad"] : ["Paid by " + c.manual.method, "ok"];
    if (!c.plan.length) return ["No plan", "muted"];
    if (!c.autopay) return ["No autopay", "warn"];
    return ["Autopay on", "ok"];
  }

  function renderList() {
    var ul = $("list");
    ul.textContent = "";
    if (!state.clients.length) { ul.appendChild(el("li", { class: "empty", text: "No clients yet. Add one below." })); return; }
    state.clients.forEach(function (c) {
      var p = statusPill(c);
      ul.appendChild(el("li", {}, [el("button", {
        type: "button", "aria-current": state.selected === c.id ? "true" : "false",
        onclick: function () { openClient(c.id); },
      }, [
        el("span", { class: "nm", text: c.name }),
        el("span", { class: "pill " + p[1], text: p[0] }),
        el("span", { class: "sub", text: planLine(c.plan, c.pending, c.manual) }),
      ])]));
    });
  }

  async function loadList() {
    var r = await api("/api/admin/clients");
    if (!r.ok) { if (r.status !== 401) { $("list").textContent = ""; $("list").appendChild(el("li", { class: "empty", text: r.data.error || "Couldn't load clients." })); } return false; }
    $("test-pill").hidden = !r.data.testMode;
    state.clients = r.data.clients;
    renderList();
    showApp();
    return true;
  }

  /* ---------- client detail ---------- */
  async function openClient(id) {
    state.selected = id;
    renderList();
    var box = $("detail");
    box.textContent = "";
    box.appendChild(el("div", { class: "panel placeholder", text: "Loading…" }));
    var r = await api("/api/admin/client?id=" + encodeURIComponent(id));
    if (!r.ok) { box.textContent = ""; box.appendChild(el("div", { class: "panel placeholder", text: r.data.error || "Couldn't load this client." })); return; }
    renderDetail(r.data);
    if (window.matchMedia("(max-width:900px)").matches) box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function tile(k, v, s) { return el("div", { class: "panel tile" }, [el("span", { class: "k", text: k }), el("span", { class: "v num", text: v }), s ? el("span", { class: "s", text: s }) : null]); }

  function renderDetail(a) {
    var box = $("detail");
    box.textContent = "";

    var row = [el("label", { class: "f", style: "flex:1 1 200px" }, ["Add a fee", mode]), valLabel, labelWrap];

    function feeFor(c) {
      var m = mode.value, v = Number(String(val.value).replace(/[$,%\s]/g, ""));
      if (!(c >= 100) || m === "none") return 0;
      if (m === "cover") return coverCardFee(c, kind);
      if (!Number.isFinite(v) || v <= 0) return 0;
      return m === "pct" ? Math.round(c * v / 100) : Math.round(v * 100);
    }
    function sync() {
      var m = mode.value;
      valLabel.style.display = m === "pct" || m === "flat" ? "" : "none";
      valLabel.firstChild.textContent = m === "pct" ? "Fee (%)" : "Fee ($)";
      labelWrap.style.display = m === "none" ? "none" : "";
    }
    [val, label].forEach(function (n) { n.addEventListener("input", onChange); });
    mode.addEventListener("change", function () { sync(); onChange(); });

    // Start from this client's last fee choice (saved with a plan or request).
    var saved = null;
    try { saved = JSON.parse((a.metadata && a.metadata.request_fee) || "null"); } catch (err) { saved = null; }
    mode.value = saved && /^(cover|pct|flat)$/.test(saved.m) ? saved.m : "none";
    val.value = saved && saved.v ? saved.v : "";
    label.value = saved && saved.l ? saved.l : "Processing fee";
    sync();

    return {
      row: row,
      feeFor: feeFor,
      labelText: function () { return label.value.trim() || "Processing fee"; },
      payload: function () { return { feeLabel: label.value, feeMode: mode.value, feeValue: val.value }; },
      reset: function () { onChange(); },
    };
  }

  function designerSection(a) {
    var rows = [
      { name: "Website build & care", amount: "250", months: "18", ongoing: false },
      { name: "Hosting & maintenance", amount: "140", months: "", ongoing: true },
    ];
    var mode = "pay"; // "pay": starts when they pay (first payment due by date); "date": fixed start date
    var start = el("input", { class: "i", type: "date", id: "pd-start", value: firstOfNextMonth() });
    var startLabel = el("span", { text: "First payment due by" });
    function modeRadio(value, label, detail) {
      return el("label", { class: "modeopt" }, [
        el("input", { type: "radio", name: "pd-mode", value: value, checked: value === mode, onchange: function () {
          mode = value; startLabel.textContent = mode === "pay" ? "First payment due by" : "First charge on"; update();
        } }),
        el("span", {}, [el("strong", { text: label }), el("span", { class: "hint", text: detail })]),
      ]);
    }
    var modes = el("div", { class: "modes" }, [
      modeRadio("pay", "Starts when they pay", "They pay the first month at /payments by the due date; the plan starts that day and later months charge automatically."),
      modeRadio("date", "Starts on a fixed date", "Charged automatically on the date you pick. Autopay must be set up before then."),
    ]);
    var list = el("div", { style: "display:flex;flex-direction:column;gap:8px" });
    var preview = el("div", { class: "preview" });
    var msg = el("p", { class: "msg err", role: "alert" });
    var confirmBox = el("div", {});
    // Fee on every phase, computed per phase (a percent fee follows the amount).
    var fee = feeControls(a, "subscription", function () { update(); });

    function draw() {
      list.textContent = "";
      rows.forEach(function (r, i) {
        var last = i === rows.length - 1;
        if (!last) r.ongoing = false;
        var nm = el("input", { class: "i", value: r.name, oninput: function (e) { r.name = e.target.value; update(); } });
        var am = el("input", { class: "i num", inputmode: "decimal", value: r.amount, oninput: function (e) { r.amount = e.target.value; update(); } });
        var mo = el("input", { class: "i num", type: "number", min: "1", max: "60", value: r.months, disabled: r.ongoing, oninput: function (e) { r.months = e.target.value; update(); } });
        list.appendChild(el("div", { class: "ph" }, [
          el("label", { class: "f nm-f" }, ["Phase " + (i + 1) + " · shows on invoices as", nm]),
          el("label", { class: "f" }, ["$ per month", am]),
          el("label", { class: "f" }, ["Months", mo]),
          el("div", { style: "display:flex;gap:10px;align-items:center" }, [
            last ? el("label", { class: "ongoing" }, [el("input", { type: "checkbox", checked: r.ongoing, onchange: function (e) { r.ongoing = e.target.checked; draw(); } }), "Ongoing"]) : null,
            rows.length > 1 ? el("button", { class: "link bad", type: "button", text: "Remove", onclick: function () { rows.splice(i, 1); draw(); } }) : null,
          ]),
        ]));
      });
      update();
    }

    function summary() {
      var s = start.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return { error: "Pick a start date." };
      // Per phase: amount is what the work costs, fee the optional line on top,
      // gross what the client actually pays each month.
      var lines = [], phases = [], offset = 0, total = 0, firstAmount = null, anyFee = false;
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i], c = toCents(r.amount), f = fee.feeFor(c), g = c + f;
        if (!r.name.trim()) return { error: "Phase " + (i + 1) + " needs a name." };
        if (!(c >= 100)) return { error: "Phase " + (i + 1) + " needs an amount." };
        if (f) anyFee = true;
        if (firstAmount === null) firstAmount = g;
        if (r.ongoing) {
          var ol = mode === "pay" ? money(g) + "/mo ongoing" + (i ? " after that" : "") : money(g) + "/mo ongoing from " + fmtMonth(addMonths(s, offset));
          lines.push((i ? "then " : "") + ol);
          phases.push({ label: ol, name: r.name.trim(), amount: c, fee: f, gross: g, months: null });
          break;
        }
        var m = Number(r.months);
        if (!(Number.isInteger(m) && m >= 1 && m <= 60)) return { error: "Phase " + (i + 1) + " needs 1 to 60 months." };
        var range = mode === "pay" ? "" : " (" + fmtMonth(addMonths(s, offset)) + " – " + fmtMonth(addMonths(s, offset + m - 1)) + ")";
        lines.push((i ? "then " : "") + money(g) + "/mo × " + m + range + " = " + money(g * m));
        phases.push({ label: money(g) + "/mo × " + m + range, name: r.name.trim(), amount: c, fee: f, gross: g, months: m });
        total += g * m; offset += m;
        if (i === rows.length - 1) lines.push("then the plan ends" + (mode === "pay" ? "" : " (" + fmtMonth(addMonths(s, offset)) + ")"));
      }
      return { lines: lines, phases: phases, total: total, first: firstAmount, anyFee: anyFee };
    }

    function update() {
      var sm = summary();
      preview.textContent = "";
      if (sm.error) { preview.appendChild(el("span", { text: sm.error })); return; }
      var dayLabel = new Date(start.value + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      preview.appendChild(el("strong", { text: mode === "pay"
        ? "First payment of " + money(sm.first) + " due by " + dayLabel + "; the plan starts the day they pay. "
        : "Starts " + dayLabel + ". " }));
      preview.appendChild(document.createTextNode(sm.lines.join(", ") + "." + (sm.total ? " Fixed-term total " + money(sm.total) + "." : "")));
      if (sm.anyFee) {
        // The fee is its own line, so spell out what each invoice will show.
        preview.appendChild(el("p", { class: "breakdown", style: "margin:8px 0 0", text: "They see on each invoice: " + sm.phases.map(function (ph) {
          return ph.name + " " + money(ph.amount) + (ph.fee ? " + " + fee.labelText() + " " + money(ph.fee) + " = " + money(ph.gross) : "");
        }).join("; then ") + "." }));
      }

      // Admin-only: what I keep after Stripe fees, per phase and for the fixed term.
      var cell = function (t, cls) { return el("td", { class: cls || null, text: t }); };
      var body = sm.phases.map(function (ph) {
        var n = ph.months || 1, sfx = ph.months ? "" : "/mo";
        return el("tr", {}, [
          cell(ph.label),
          cell(money(ph.gross * n) + sfx),
          cell(money(keep(ph.gross, "bank") * n) + sfx, "keep"),
          cell(money(keep(ph.gross, "card") * n) + sfx),
        ]);
      });
      var fixed = sm.phases.filter(function (ph) { return ph.months; });
      if (fixed.length > 1) {
        body.push(el("tr", {}, [
          cell("Fixed-term total"),
          cell(money(sm.total)),
          cell(money(fixed.reduce(function (t, ph) { return t + keep(ph.gross, "bank") * ph.months; }, 0)), "keep"),
          cell(money(fixed.reduce(function (t, ph) { return t + keep(ph.gross, "card") * ph.months; }, 0))),
        ]));
      }
      preview.appendChild(el("div", { class: "nettable-wrap" }, [el("table", { class: "nettable" }, [
        el("thead", {}, [el("tr", {}, [el("th", { text: "Phase" }), el("th", { text: "Client pays" }), el("th", { text: "You keep (bank)" }), el("th", { text: "You keep (card)" })])]),
        el("tbody", {}, body),
      ])]));
    }
    start.addEventListener("input", update);

    var createBtn = el("button", { class: "btn", type: "button", text: "Create plan…", onclick: function () {
      msg.textContent = "";
      var sm = summary();
      if (sm.error) { msg.textContent = sm.error; return; }
      confirmBox.textContent = "";
      var rq = rid();
      confirmBox.appendChild(el("div", { class: "confirm" }, [
        el("p", { text: mode === "pay"
          ? "Save this plan for " + a.client.name + "? Nothing is charged until they pay the first " + money(sm.first) + " at /payments. Afterwards, email them the invite so they get the link."
          : "Create this plan for " + a.client.name + "? " + (a.autopay ? "Autopay is set up, so " + money(sm.first) + " will be charged on the start date." : "Autopay isn't set up yet; the first charge on the start date will fail unless they set it up first.") }),
        el("div", { class: "row" }, [
          el("button", { class: "btn", type: "button", text: mode === "pay" ? "Save plan" : "Create plan", onclick: async function (e) {
            e.currentTarget.disabled = true;
            var r = await api("/api/admin/client", Object.assign({
              id: a.id, action: "plan", mode: mode, start: start.value, requestId: rq,
              phases: rows.map(function (x) {
                var c = toCents(x.amount);
                return { name: x.name, amount: x.amount.replace(/[$,\s]/g, ""), months: Number(x.months), ongoing: x.ongoing, fee: (fee.feeFor(c) / 100).toFixed(2) };
              }),
            }, fee.payload()));
            if (!r.ok) { msg.textContent = r.data.error || "Failed."; confirmBox.textContent = ""; return; }
            openClient(a.id); loadList();
          } }),
          el("button", { class: "btn ghost", type: "button", text: "Cancel", onclick: function () { confirmBox.textContent = ""; } }),
        ]),
      ]));
    } });

    draw();
    return el("section", { class: "panel sec designer" }, [
      el("h2", { text: "Design a plan" }),
      el("p", { class: "hint", text: "Phases run back to back; the last one can continue indefinitely. Each month is charged automatically on the day the plan started." }),
      modes,
      el("div", { class: "row" }, [el("label", { class: "f", style: "flex:0 1 200px" }, [startLabel, start])]),
      list,
      el("div", {}, [el("button", { class: "link", type: "button", text: "+ Add a phase", onclick: function () {
        rows.forEach(function (r) { if (r.ongoing) { r.ongoing = false; if (!r.months) r.months = "12"; } });
        rows.push({ name: "Hosting & maintenance", amount: "", months: "", ongoing: true }); draw();
      } })]),
      el("div", { class: "row", style: "margin-top:10px" }, fee.row),
      el("p", { class: "hint", text: "A fee is billed as its own line on every phase, so each invoice shows the work and the fee separately. It can be removed later like an add-on." }),
      preview, feeNote("subscription"), el("div", {}, [createBtn]), confirmBox, msg,
      manualOffer(a),
    ]);
  }

  // Under the designer: the alternative for clients who pay by Venmo, Zelle or check.
  function manualOffer(a) {
    var box = el("div", {});
    var open = el("button", { class: "link", type: "button", text: "Pays outside Stripe instead? (Venmo, Zelle, check…)", onclick: function () {
      box.textContent = "";
      box.appendChild(el("div", { class: "confirm" }, [
        el("p", { class: "hint", text: "No Stripe charges. I'll keep track of what's due, you record each payment when it arrives, and the client gets a paid receipt." }),
        manualForm(a, null, function () { openClient(a.id); loadList(); }),
        el("button", { class: "link", type: "button", text: "Never mind", onclick: function () { box.textContent = ""; } }),
      ]));
    } });
    return el("div", { style: "margin-top:18px;padding-top:14px;border-top:1px solid var(--line, #e2dcd0)" }, [open, box]);
  }

  /* One-off payment request, with the same optional fee as a plan. */
  function requestSection(a) {
    var amt = el("input", { class: "i num", inputmode: "decimal", placeholder: "500" });
    var desc = el("input", { class: "i", placeholder: "Logo refresh", autocomplete: "off" });
    var due = el("input", { class: "i num", type: "number", min: "0", max: "90", value: "14" });
    var note = el("textarea", { class: "i", rows: "2", placeholder: "Optional note in the email, e.g. Thanks! Rent for November.", "aria-label": "Note to payee" });
    var msg = el("p", { class: "msg err", role: "alert" });
    var btn = el("button", { class: "btn", type: "submit", text: "Send payment request" });
    var breakdown = el("p", { class: "breakdown" });
    var reqNet = el("p", { class: "net" });
    var fee = feeControls(a, "invoice", function () { update(); });

    function feeCents() { return fee.feeFor(toCents(amt.value)); }
    function update() {
      var c = toCents(amt.value), f = feeCents();
      if (!(c >= 100)) { breakdown.textContent = ""; reqNet.textContent = ""; return; }
      breakdown.textContent = f
        ? "They see: " + (desc.value.trim() || "Amount") + " " + money(c) + " + " + fee.labelText() + " " + money(f) + " = " + money(c + f) + " total"
        : "";
      reqNet.textContent = keepText(c + f, "invoice", null) + ".";
    }
    [amt, desc].forEach(function (n) { n.addEventListener("input", update); });
    update();

    var rq = rid();
    return el("section", { class: "panel sec" }, [
      el("h2", { text: "One-off payment request" }),
      el("p", { class: "hint", text: "I email them the request with a Pay button (bank or card), listing any fee on its own line. It also shows on their /payments page. The fee choice is remembered per client." }),
      el("form", { novalidate: true, onsubmit: async function (e) {
        e.preventDefault(); msg.textContent = ""; msg.className = "msg err"; btn.disabled = true;
        var f = feeCents();
        var r = await api("/api/admin/client", Object.assign({
          id: a.id, action: "request", amount: amt.value.replace(/[$,\s]/g, ""), description: desc.value,
          daysUntilDue: Number(due.value), fee: (f / 100).toFixed(2),
          note: note.value, requestId: rq,
        }, fee.payload()));
        btn.disabled = false;
        if (!r.ok) { msg.textContent = r.data.error || "Failed."; return; }
        rq = rid(); amt.value = ""; desc.value = ""; note.value = ""; update();
        msg.className = "msg ok";
        msg.textContent = "Sent invoice " + r.data.number + (r.data.emailed ? " to " + r.data.emailed : "") +
          (r.data.viaStripe ? " (Stripe's email; mine failed)" : r.data.copiedTo ? ". Copy sent to " + r.data.copiedTo : "") + ".";
        setTimeout(function () { openClient(a.id); loadList(); }, 1200);
      } }, [
        el("div", { class: "row" }, [
          el("label", { class: "f", style: "flex:2 1 220px" }, ["For", desc]),
          el("label", { class: "f", style: "flex:1 1 90px" }, ["Amount ($)", amt]),
          el("label", { class: "f", style: "flex:0 1 110px" }, ["Due in (days)", due]),
        ]),
        el("div", { class: "row", style: "margin-top:10px" }, fee.row),
        el("label", { class: "f", style: "margin-top:10px" }, ["Note (optional)", note]),
        breakdown,
        el("div", { style: "margin-top:12px" }, [btn]),
      ]),
      reqNet, msg, feeNote("invoice"),
    ]);
  }

  function invoicesSection(a) {
    var box = el("div", { class: "inv" });
    var msg = el("p", { class: "msg err", role: "alert" });
    if (!a.invoices.length) box.appendChild(el("p", { class: "empty", text: "No invoices yet." }));
    a.invoices.forEach(function (inv) {
      var st = inv.status === "paid" ? ["Paid", "ok"] : inv.status === "open" ? (inv.processing ? ["Processing", "muted"] : inv.attempted ? ["Failed", "bad"] : ["Due", "warn"]) : [inv.status, "muted"];
      // Unpaid one-off requests can be cancelled (voided); the payee gets an email.
      var canVoid = inv.oneOff && inv.status === "open" && !inv.processing && inv.remaining === inv.total;
      var confirmBox = el("div", {});
      var voidBtn = canVoid ? el("button", { class: "link bad", type: "button", text: "Void", style: "margin-left:10px", onclick: function () {
        confirmBox.textContent = "";
        var note = el("textarea", { class: "i", rows: "2", placeholder: "Optional note, e.g. Sorry, that one was a test.", "aria-label": "Note to payee" });
        var vr = rid();
        confirmBox.appendChild(el("div", { class: "confirm", style: "margin:0 14px 10px" }, [
          el("p", { text: "Cancel " + (inv.number || "this invoice") + " for " + money(inv.total) + "? It can't be paid after this, and I'll email " + (a.client.email || "them") + " that it's cancelled." }),
          note,
          el("div", { class: "row" }, [
            el("button", { class: "btn danger small", type: "button", text: "Void and email them", onclick: async function (e) {
              e.currentTarget.disabled = true; msg.className = "msg err"; msg.textContent = "";
              var r = await api("/api/admin/client", { id: a.id, action: "invoice-void", invoice: inv.id, note: note.value, requestId: vr });
              if (!r.ok) { msg.textContent = r.data.error || "Failed."; confirmBox.textContent = ""; return; }
              msg.className = r.data.emailError ? "msg err" : "msg ok";
              msg.textContent = r.data.emailError || ("Voided " + (inv.number || "") + (r.data.emailed ? " and emailed " + r.data.emailed : "") + ".");
              setTimeout(function () { openClient(a.id); loadList(); }, 1500);
            } }),
            el("button", { class: "btn ghost small", type: "button", text: "Keep it", onclick: function () { confirmBox.textContent = ""; } }),
          ]),
        ]));
      } }) : null;
      box.appendChild(el("div", { class: "inv-row" }, [
        el("span", { class: "num", text: date(inv.created) }),
        el("span", { class: "d", text: (inv.number || "") + (inv.description ? " · " + inv.description : "") }),
        el("span", { class: "a", text: money(inv.total) }),
        el("span", {}, [el("span", { class: "pill " + st[1], text: st[0] })]),
        el("span", { class: "l" }, [inv.url ? el("a", { href: inv.url, target: "_blank", rel: "noopener", text: "View" }) : null, voidBtn]),
      ]));
      box.appendChild(confirmBox);
    });
    return el("section", { class: "panel sec" }, [el("h2", { text: "Invoices" }), box, msg]);
  }

  /* ---------- wiring ---------- */
  $("login").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("login-msg").textContent = "";
    var r = await api("/api/admin/session", { password: $("pw").value });
    if (!r.ok) { $("login-msg").textContent = r.data.error || "Sign-in failed."; return; }
    $("pw").value = "";
    loadList();
  });

  $("signout").addEventListener("click", async function () {
    await api("/api/admin/session", undefined, "DELETE");
    state = { clients: [], selected: null };
    $("detail").textContent = "";
    $("detail").appendChild(el("div", { class: "panel placeholder", text: "Pick a client, or add a new one." }));
    showLogin();
  });

  $("refresh").addEventListener("click", function () { loadList(); if (state.selected) openClient(state.selected); });

  var ncReq = rid();
  $("new-client").addEventListener("submit", async function (e) {
    e.preventDefault();
    $("nc-msg").textContent = "";
    var name = $("nc-name").value.trim(), email = $("nc-email").value.trim();
    var r = await api("/api/admin/clients", { name: name, email: email, requestId: ncReq });
    if (!r.ok) { $("nc-msg").textContent = r.data.error || "Couldn't add the client."; return; }
    ncReq = rid();
    $("nc-name").value = ""; $("nc-email").value = "";
    await loadList();
    // Stripe's search index can lag a minute behind a new client; show it now.
    if (!state.clients.some(function (c) { return c.id === r.data.id; })) {
      state.clients.push({ id: r.data.id, name: name, email: email, plan: [], nextCharge: null, autopay: null, owed: 0, failed: false });
      renderList();
    }
    openClient(r.data.id);
  });

  loadList();
})();
</script>
</body>
</html>
